[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
network = "monad"
solc_version = "0.8.31"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
use_literal_content = true
bytecode_hash = "none"
ffi = false
fs_permissions = [{ access = "read-write", path = "../deployments" }, { access = "read-write", path = "./out" }]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 256
depth = 50
fail_on_revert = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[lint]
exclude_lints = ["locked-ether", "missing-events-access-control", "block-timestamp", "arbitrary-send-eth", "reentrancy-events", "calls-loop", "require-revert-in-loop", "environment-read-across-mutation"]
