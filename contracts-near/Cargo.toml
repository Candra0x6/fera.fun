[package]
name = "fera-arena"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"
uint = { version = "0.10.2", default-features = false }

[features]
replay = []

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
fera-arena = { path = ".", features = ["replay"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
